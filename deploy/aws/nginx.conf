server {
    listen 80;
    server_name _;

    # Uploads (20 MB quota) and .zip presentation imports
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # Backend HTTP routes
    location ~ ^/(api|static|health|docs|openapi\.json)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The AI assistant streams responses (SSE) that can pause while a model thinks
        proxy_read_timeout 300s;
    }

    # Live rooms (WebSocket)
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # React SPA: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
