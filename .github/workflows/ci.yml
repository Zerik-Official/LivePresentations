name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npx tsc -b --noEmit || npx tsc --noEmit
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL || 'http://localhost:8000' }}
          VITE_TURNSTILE_PUBLIC_KEY: ${{ vars.VITE_TURNSTILE_PUBLIC_KEY }}
